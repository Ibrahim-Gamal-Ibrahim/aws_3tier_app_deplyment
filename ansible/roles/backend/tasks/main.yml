---
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  become: true

- name: Wait for apt lock
  ansible.builtin.shell: |
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
          fuser /var/lib/dpkg/lock >/dev/null 2>&1 || \
          fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
      sleep 5
    done
  changed_when: false
  become: true


- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Install Node.js and npm
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present
  become: true

- name: Stop temporary backend test service
  ansible.builtin.systemd:
    name: backend-test
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Create backend application directory
  ansible.builtin.file:
    path: /opt/todo-backend
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  become: true

- name: Copy backend package.json
  ansible.builtin.copy:
    src: package.json
    dest: /opt/todo-backend/package.json
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  become: true

- name: Copy backend application
  ansible.builtin.copy:
    src: server.js
    dest: /opt/todo-backend/server.js
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  become: true
  notify: Restart backend

- name: Install Node.js dependencies
  community.general.npm:
    path: /opt/todo-backend
    production: true
  become: true
  become_user: ubuntu

- name: Install backend systemd unit
  ansible.builtin.template:
    src: todo-backend.service.j2
    dest: /etc/systemd/system/todo-backend.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Restart backend

- name: Ensure backend service is enabled and running
  ansible.builtin.systemd:
    name: todo-backend
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Wait for backend port
  ansible.builtin.wait_for:
    port: 3000
    host: 127.0.0.1
    delay: 2
    timeout: 30

- name: Verify backend health
  ansible.builtin.uri:
    url: http://127.0.0.1:3000/health
    method: GET
    status_code: 200
    return_content: true